# Public NEXT_PUBLIC_* values only. Never pass API/server secrets as build args.
steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --platform=linux/amd64
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_NEXT_PUBLIC_FIREBASE_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID=${_NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_PRO_PRICE_ID=${_NEXT_PUBLIC_STRIPE_PRO_PRICE_ID}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_CREDITS_100_PRICE_ID=${_NEXT_PUBLIC_STRIPE_CREDITS_100_PRICE_ID}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_CREDITS_500_PRICE_ID=${_NEXT_PUBLIC_STRIPE_CREDITS_500_PRICE_ID}
      - --build-arg
      - NEXT_PUBLIC_STRIPE_CREDITS_1500_PRICE_ID=${_NEXT_PUBLIC_STRIPE_CREDITS_1500_PRICE_ID}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
  # Real CPU ONNX inference is exercised during build, not merely an import.
  machineType: E2_HIGHCPU_32
